<style>
:root{--bg:#fff;--card:#fff;--ink:#17131f;--mut:#6b6577;--line:#e4e1ec;--ac:#5b3df5;--acs:#ece8ff;--hd:#15111f;--ok:#12805c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f0c16;--card:#1a1524;--ink:#f2eff8;--mut:#a29bb3;--line:#2c2540;--ac:#8d78ff;--acs:#262046;--hd:#0a0810;--ok:#4cd6a4}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f0c16;--card:#1a1524;--ink:#f2eff8;--mut:#a29bb3;--line:#2c2540;--ac:#8d78ff;--acs:#262046;--hd:#0a0810;--ok:#4cd6a4}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hd);color:#fff;padding:28px 20px 28px}
.logo{display:block;width:112px;height:112px;border-radius:16px;background:#fff;margin-bottom:18px;object-fit:cover}
.w{max-width:1080px;margin:0 auto}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px);line-height:1.1;letter-spacing:-.02em}
header p{margin:0;color:#c9c3d8;max-width:520px}
.perks{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.perks span{background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:6px 14px;font-size:14px}
.gift{background:var(--acs);color:var(--ac);text-align:center;padding:10px 16px;font-weight:600;font-size:14px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:20px 0 8px}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.bar input,.bar select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:150px}
.bar .grow{flex:1;min-width:200px}
.bar input:focus-visible,.bar select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.count{color:var(--mut);font-size:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.card h2{margin:0;font-size:20px;line-height:1.2}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid #0003;flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{background:var(--acs);color:var(--ac);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:600}
.tags .bat{background:transparent;border:1px solid var(--line);color:var(--ok)}
.col{color:var(--mut);font-size:14px;text-transform:capitalize}
.usd{font-size:28px;font-weight:800;letter-spacing:-.02em}
.ars{color:var(--mut);font-size:14px;margin-top:-6px}
details{border-top:1px solid var(--line);padding-top:8px;font-size:14px}
summary{cursor:pointer;font-weight:600;color:var(--ac)}
.q{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:8px}
.q b{text-align:right}
.stock{font-size:13px;color:var(--mut)}
.wa{margin-top:auto;display:block;text-align:center;background:var(--ac);color:#fff;text-decoration:none;border-radius:10px;padding:11px;font-weight:700}
.wa:hover{filter:brightness(1.1)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
footer{color:var(--mut);font-size:13px;text-align:center;padding:0 20px 32px}
[hidden]{display:none!important}

.ball{display:block;border-radius:50%;margin-top:-3px;position:relative;box-shadow:0 3px 6px #0006}
.ball.r{background:radial-gradient(circle at 32% 28%,#ffb3b3 0 6%,#e0262f 20%,#8c0f17 100%)}
.ball.g{background:radial-gradient(circle at 32% 28%,#fff6c9 0 6%,#f2c542 22%,#a8760f 100%)}
.ball::before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:5px;margin-left:-4px;background:#d9b44a;border-radius:2px 2px 0 0}
.ball::after{content:"";position:absolute;left:22%;top:18%;width:22%;height:22%;border-radius:50%;background:#fff;opacity:.7;animation:tw 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}@keyframes tw{50%{opacity:.25;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.str,.gl,.ball::after{animation:none}}
.ph{height:150px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph svg{width:105px;height:140px;flex:none;display:block}.ph img{width:100%;height:100%;object-fit:contain;background:#fff}
#adm{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:20px}
#adm h2{margin:0 0 12px}#adm label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
#adm input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
#adm button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
#adm button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
#dol{max-width:160px;margin-bottom:8px}#st{font-size:14px;margin-left:8px}
</style>
